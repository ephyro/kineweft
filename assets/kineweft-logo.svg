<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="title desc">
  <title id="title">Kineweft</title>
  <desc id="desc">Kineweft wordmark with a woven K made from motion ribbons.</desc>
  <defs>
    <linearGradient id="field" x1="24" y1="18" x2="730" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#245C4A"/>
      <stop offset="1" stop-color="#102E27"/>
    </linearGradient>
    <linearGradient id="gold" x1="63" y1="146" x2="149" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C89B52"/>
      <stop offset="1" stop-color="#E7C77E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#071D17" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="760" height="200" rx="42" fill="url(#field)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M57 45v110" stroke="#F5F0DF" stroke-width="17"/>
    <path d="M64 100h23" stroke="#F5F0DF" stroke-width="17"/>
    <path d="m82 100 52-55" stroke="url(#gold)" stroke-width="17"/>
    <path d="m82 100 59 55" stroke="#F5F0DF" stroke-width="17"/>
  </g>
  <circle cx="145" cy="40" r="6" fill="#E7C77E"/>
  <circle cx="151" cy="160" r="6" fill="#F5F0DF"/>
  <text x="196" y="112" fill="#F5F0DF" font-family="Inter, Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="5">KINEWEFT</text>
  <text x="201" y="147" fill="#BFD0C6" font-family="Inter, Avenir Next, Avenir, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="3.6">MOTION, STRUCTURED</text>
</svg>
