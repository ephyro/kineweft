<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Kineweft mark</title>
  <desc id="desc">A woven letter K made from motion ribbons.</desc>
  <defs>
    <linearGradient id="field" x1="20" y1="12" x2="142" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#245C4A"/>
      <stop offset="1" stop-color="#102E27"/>
    </linearGradient>
    <linearGradient id="gold" x1="54" y1="122" x2="132" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C89B52"/>
      <stop offset="1" stop-color="#E7C77E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#071D17" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="160" height="160" rx="38" fill="url(#field)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M48 35v90" stroke="#F5F0DF" stroke-width="14"/>
    <path d="M54 80h19" stroke="#F5F0DF" stroke-width="14"/>
    <path d="m69 80 43-45" stroke="url(#gold)" stroke-width="14"/>
    <path d="m69 80 48 45" stroke="#F5F0DF" stroke-width="14"/>
  </g>
  <circle cx="121" cy="31" r="5" fill="#E7C77E"/>
  <circle cx="126" cy="129" r="5" fill="#F5F0DF"/>
</svg>
